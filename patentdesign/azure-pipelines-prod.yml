# ===========================
# PRODUCTION DEPLOYMENT PIPELINE
# ===========================

# Only trigger this pipeline when code is pushed to the production branch
trigger:
  branches:
    include:
      - production

# Disable PR-triggered runs
pr: none

# Use your self-hosted IIS agent pool
pool:
  name: 'IISPool'

variables:
  buildConfiguration: 'Release'

stages:
  # ===========================
  # 1️⃣ BUILD STAGE
  # ===========================
  - stage: Build
    displayName: 'Build .NET 8 Backend'
    jobs:
      - job: BuildJob
        displayName: 'Restore, Build, and Publish'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 8 SDK'
            inputs:
              packageType: 'sdk'
              version: '8.x'
          
          # Restore dependencies
          - script: dotnet restore ./patentdesign.csproj
            displayName: 'Restore dependencies'
          
          # Build & publish to artifact staging directory
          - script: dotnet publish ./patentdesign.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend
            displayName: 'Build & Publish Backend'
          
          # Optional: verify the artifact folder exists
          - script: dir $(Build.ArtifactStagingDirectory)
            displayName: 'Check Artifact Directory'
          
          # Publish the build output as an artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              publishLocation: 'Container'
  
  
  # ===========================
  # 2️⃣ DEPLOY STAGE
  # ===========================
  - stage: Deploy
    displayName: 'Deploy to IIS Server'
    dependsOn: Build
    # 🔒 Only deploy if manually triggered or approved
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/production'))
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to IIS'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend

                - task: PowerShell@2
                  displayName: 'Stop App Pool, Clear Old Files, and Deploy New Build'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Import-Module WebAdministration
                      
                      $appPool = "IPONigeriaBackend"
                      $source = "$(Pipeline.Workspace)\backend\*"
                      $destination = "C:\inetpub\wwwroot\IPO Nigeria Backend"
                      
                      Write-Host "Stopping App Pool: $appPool"
                      try {
                        if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
                            Stop-WebAppPool -Name $appPool
                        } else {
                            Write-Host "App Pool '$appPool' is already stopped."
                        }
                      } catch {
                        Write-Host "Warning: Could not stop App Pool. Continuing... ($($_.Exception.Message))"
                      }
                      
                      Write-Host "Removing old files in $destination"
                      Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
                      
                      Write-Host "Copying new build from $source to $destination"
                      Copy-Item -Path $source -Destination $destination -Recurse -Force
                      
                      Write-Host "Starting App Pool: $appPool"
                      if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                          Start-WebAppPool -Name $appPool
                      } else {
                          Write-Host "App Pool '$appPool' is already running."
                      }
