trigger:
- production

pool:
  name: 'IISPool'

pr: none

variables:
- group: iponigeria-production-variables  # Azure DevOps variable group with your secrets
- name: buildConfiguration
  value: Release

stages:
# ---------------------- BUILD STAGE ----------------------
- stage: Build
  displayName: 'Build .NET 8 backend'
  jobs:
  - job: BuildJob
    displayName: 'Build and Publish for Production'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
      displayName: 'Install .NET 8 SDK'

    - script: dotnet restore ./patentdesign/patentdesign.csproj
      displayName: 'Restore dependencies'

    - script: dotnet publish ./patentdesign/patentdesign.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend
      displayName: 'Build & publish backend'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
        ArtifactName: 'backend'
        publishLocation: 'Container'
      displayName: 'Publish build artifacts'

# ---------------------- DEPLOY STAGE ----------------------
- stage: Deploy
  displayName: 'Deploy to IIS'
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: 'Deploy Application (Production)'
    steps:
    - download: current
      artifact: backend

    # ---------------------- 1️⃣ Inject environment variables into IIS App Pool (Production) ----------------------
    - task: PowerShell@2
      displayName: 'Inject environment variables into IIS App Pool (Production)'
      env:
        MONGODB_CONNECTION_STRING: $(MONGODB_CONNECTION_STRING)
        JWT_KEY: $(JWT_KEY)
        SMTP_SERVER: $(SMTP_SERVER)
        SMTP_USERNAME: $(SMTP_USERNAME)
        SMTP_PASSWORD: $(SMTP_PASSWORD)
        RESEND_APIKEY: $(RESEND_APIKEY)
        RESEND_FROM_EMAIL: $(RESEND_FROM_EMAIL)
        RESEND_FROM_NAME: $(RESEND_FROM_NAME)
        RESEND_TEMPLATE_OPPOSITION: $(RESEND_TEMPLATE_OPPOSITION)
        RESEND_TEMPLATE_RENEWAL_EARLY_REMINDER: $(RESEND_TEMPLATE_RENEWAL_EARLY_REMINDER)
        RESEND_TEMPLATE_RENEWAL_DUE_NOTICE: $(RESEND_TEMPLATE_RENEWAL_DUE_NOTICE)
        RESEND_TEMPLATE_COUNTER_STATEMENT: $(RESEND_TEMPLATE_COUNTER_STATEMENT)
        RESEND_TEMPLATE_OPPOSITION_CONFIRMATION: $(RESEND_TEMPLATE_OPPOSITION_CONFIRMATION)
        RESEND_TEMPLATE_STATUTORY_DECLARATION: $(RESEND_TEMPLATE_STATUTORY_DECLARATION)
        RESEND_TEMPLATE_WITHDRAWAL_NOTIFICATION: $(RESEND_TEMPLATE_WITHDRAWAL_NOTIFICATION)
        RESEND_TEMPLATE_WITHDRAWAL_APPROVED: $(RESEND_TEMPLATE_WITHDRAWAL_APPROVED)
        RESEND_TEMPLATE_WITHDRAWAL_REFUSED: $(RESEND_TEMPLATE_WITHDRAWAL_REFUSED)
        RESEND_TEMPLATE_RESET_PASSWORD: $(RESEND_TEMPLATE_RESET_PASSWORD)
        RESEND_TEMPLATE_WELCOMEVERIFICATION: $(RESEND_TEMPLATE_WELCOMEVERIFICATION)
        RESEND_TEMPLATE_STATUS_UPDATE: $(RESEND_TEMPLATE_STATUS_UPDATE)
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration

          $appPool = "integration.iponigeria.com(domain)(4.0)(pool)"

          $envVars = @{
              ASPNETCORE_ENVIRONMENT   = "Production"
              PORTAL_BASE_URL           = "https://portal.iponigeria.com"
              MONGODB_CONNECTION_STRING = $env:MONGODB_CONNECTION_STRING
              JWT_KEY                   = $env:JWT_KEY
              SMTP_SERVER               = $env:SMTP_SERVER
              SMTP_USERNAME             = $env:SMTP_USERNAME
              SMTP_PASSWORD             = $env:SMTP_PASSWORD
              RESEND_APIKEY             = $env:RESEND_APIKEY
              RESEND_FROM_EMAIL         = $env:RESEND_FROM_EMAIL
              RESEND_FROM_NAME          = $env:RESEND_FROM_NAME
              RESEND_TEMPLATE_OPPOSITION = $env:RESEND_TEMPLATE_OPPOSITION
              RESEND_TEMPLATE_RENEWAL_EARLY_REMINDER = $env:RESEND_TEMPLATE_RENEWAL_EARLY_REMINDER
              RESEND_TEMPLATE_RENEWAL_DUE_NOTICE = $env:RESEND_TEMPLATE_RENEWAL_DUE_NOTICE
              RESEND_TEMPLATE_COUNTER_STATEMENT = $env:RESEND_TEMPLATE_COUNTER_STATEMENT
              RESEND_TEMPLATE_OPPOSITION_CONFIRMATION = $env:RESEND_TEMPLATE_OPPOSITION_CONFIRMATION
              RESEND_TEMPLATE_STATUTORY_DECLARATION = $env:RESEND_TEMPLATE_STATUTORY_DECLARATION
              RESEND_TEMPLATE_WITHDRAWAL_NOTIFICATION = $env:RESEND_TEMPLATE_WITHDRAWAL_NOTIFICATION
              RESEND_TEMPLATE_WITHDRAWAL_APPROVED = $env:RESEND_TEMPLATE_WITHDRAWAL_APPROVED
              RESEND_TEMPLATE_WITHDRAWAL_REFUSED = $env:RESEND_TEMPLATE_WITHDRAWAL_REFUSED
              RESEND_TEMPLATE_RESET_PASSWORD = $env:RESEND_TEMPLATE_RESET_PASSWORD
              RESEND_TEMPLATE_WELCOMEVERIFICATION = $env:RESEND_TEMPLATE_WELCOMEVERIFICATION
              RESEND_TEMPLATE_STATUS_UPDATE = $env:RESEND_TEMPLATE_STATUS_UPDATE
          }

          foreach ($name in @($envVars.Keys)) {
              $value = [string]$envVars[$name]
              if ([string]::IsNullOrWhiteSpace($value) -or $value -match '\$\(|\$\{|^tmpl_x+$') {
                  if ($name -like 'SMTP_*') { $envVars.Remove($name); continue }
                  throw "Configure a real value for '$name' in the production variable group before deployment."
              }
          }

          $filter = "/system.applicationHost/applicationPools/add[@name='$appPool']/environmentVariables"
          $existing = @(Get-WebConfigurationProperty -Filter $filter -PSPath "IIS:\" -Name "Collection")
          Write-Host "Injecting environment variables into App Pool: $appPool"
          foreach ($name in $envVars.Keys) {
              if ($existing | Where-Object { $_.Name -eq $name }) {
                  Set-WebConfigurationProperty -PSPath "IIS:\" -Filter "$filter/add[@name='$name']" `
                      -Name "value" -Value $envVars[$name]
              } else {
                  Add-WebConfigurationProperty -PSPath "IIS:\" -Filter $filter `
                      -Name "." -Value @{name=$name; value=$envVars[$name]}
              }
              Write-Host " - $name set"
          }

    # ---------------------- 2️⃣ Set ASPNETCORE_ENVIRONMENT=Production for this App Pool ----------------------
    - task: PowerShell@2
      displayName: 'Set ASPNETCORE_ENVIRONMENT=Production for App Pool'
      inputs:
        targetType: 'inline'
        script: |
          Import-Module WebAdministration

          $appPool = "integration.iponigeria.com(domain)(4.0)(pool)"

          # Get the environment variable collection
          $envVars = Get-WebConfigurationProperty -Filter "/system.applicationHost/applicationPools/add[@name='$appPool']/environmentVariables" -PSPath "IIS:\" -Name "Collection"

          # Check if ASPNETCORE_ENVIRONMENT exists
          $existingVar = $envVars | Where-Object { $_.Name -eq "ASPNETCORE_ENVIRONMENT" }

          if ($existingVar) {
              # Update its value
              Set-WebConfigurationProperty -Filter "/system.applicationHost/applicationPools/add[@name='$appPool']/environmentVariables/add[@name='ASPNETCORE_ENVIRONMENT']" `
                  -PSPath "IIS:\" -Name "value" -Value "Production"
          } else {
              # Add it
              Add-WebConfigurationProperty -Filter "/system.applicationHost/applicationPools/add[@name='$appPool']/environmentVariables" `
                  -PSPath "IIS:\" -Name "." -Value @{name="ASPNETCORE_ENVIRONMENT"; value="Production"}
          }

          Write-Host "ASPNETCORE_ENVIRONMENT set to Production for $appPool"

    # ---------------------- 3️⃣ Stop App Pool, deploy files & restart ----------------------
    - task: PowerShell@2
      displayName: 'Stop App Pool, deploy files & start'
      inputs:
        targetType: 'inline'
        script: |
          Import-Module WebAdministration

          $appPool = "integration.iponigeria.com(domain)(4.0)(pool)"
          $source = "$(Pipeline.Workspace)\backend\*"
          $destination = "C:\inetpub\vhosts\iponigeria.com\integration.iponigeria.com"

          # Stop the App Pool
          Write-Host "Stopping App Pool: $appPool"
          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
              Stop-WebAppPool -Name $appPool
          }

          # Wait for worker processes to exit
          $maxWait = 30
          $elapsed = 0
          while ($elapsed -lt $maxWait) {
              $workers = Get-ChildItem "IIS:\AppPools\$appPool\WorkerProcesses" -ErrorAction SilentlyContinue
              if (-not $workers -or $workers.Count -eq 0) { break }
              Write-Host "Waiting for worker processes to exit... ($elapsed s)"
              Start-Sleep -Seconds 2
              $elapsed += 2
          }

          # Force kill remaining workers if needed
          if ($elapsed -ge $maxWait) {
              Write-Host "Force-killing remaining worker processes."
              $workers = Get-ChildItem "IIS:\AppPools\$appPool\WorkerProcesses" -ErrorAction SilentlyContinue
              foreach ($w in $workers) { Stop-Process -Id $w.processId -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 2
          }

          # Remove old files
          Write-Host "Removing old files in $destination"
          Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue

          # Copy new files with retry
          $retries = 3
          for ($i = 1; $i -le $retries; $i++) {
              try {
                  Write-Host "Copying new build (attempt $i of $retries)..."
                  Copy-Item -Path $source -Destination $destination -Recurse -Force -ErrorAction Stop
                  Write-Host "Copy succeeded."
                  break
              } catch {
                  Write-Host "Copy failed: $_"
                  if ($i -eq $retries) { throw }
                  Start-Sleep -Seconds 5
              }
          }

          # Start the App Pool
          Write-Host "Starting App Pool: $appPool"
          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
              Start-WebAppPool -Name $appPool
          }