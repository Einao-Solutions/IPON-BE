trigger:
  - dev           # Runs only when changes are pushed to 'dev' branch

pr: none        # Prevents auto-builds for pull requests

pool:
  name: 'IISPool'   # Your self-hosted agent pool name

variables:
  buildConfiguration: 'Debug'   # Typically use Debug for dev
  environmentName: 'Development'

stages:
  # ================================
  # 🔨 BUILD STAGE
  # ================================
  - stage: Build
    displayName: 'Build .NET 8 Backend (Dev)'
    jobs:
      - job: BuildJob
        displayName: 'Build and Publish for Dev'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'
            displayName: 'Install .NET 8 SDK'

          - script: dir
            displayName: 'List project directory (debug step)'

          - script: dotnet restore ./patentdesign.csproj
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Restore dependencies'

          - script: dotnet publish ./patentdesign.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Build & Publish backend'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'
  
  
  # ================================
  # 🚀 DEPLOY STAGE (DEV)
  # ================================
  - stage: Deploy
    displayName: 'Deploy to Dev IIS Server'
    dependsOn: Build
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy Application (Dev)'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: backend

                - task: PowerShell@2
                  displayName: 'Stop Dev App Pool, clear old files & deploy new version'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Import-Module WebAdministration
                      
                      $appPool = "IPONigeriaBackend-Dev"   # Dev app pool
                      $source = "$(Pipeline.Workspace)\backend\*"
                      $destination = "C:\Users\einaoadmin\Desktop\UpLinks\publish"   # Dev destination
                      
                      Write-Host "Stopping App Pool: $appPool"
                      try {
                        if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
                            Stop-WebAppPool -Name $appPool
                        } else {
                            Write-Host "App Pool '$appPool' is already stopped."
                        }
                      } catch {
                        Write-Host "Warning: Could not stop App Pool. Continuing... ($($_.Exception.Message))"
                      }
                      
                      Write-Host "Removing old files in $destination"
                      Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
                      
                      Write-Host "Copying new build from $source to $destination"
                      Copy-Item -Path $source -Destination $destination -Recurse -Force
                      
                      Write-Host "Starting App Pool: $appPool"
                      if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                          Start-WebAppPool -Name $appPool
                      } else {
                          Write-Host "App Pool '$appPool' is already running."
                      }
