trigger:
  - dev

pool:
  name: 'IISPool'

pr: none

variables:
  buildConfiguration: 'Debug'

stages:
  - stage: Build
    displayName: 'Build .NET 8 Backend (Dev)'
    jobs:
      - job: BuildJob
        displayName: 'Build and Publish for Dev'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'
            displayName: 'Install .NET 8 SDK'

          - script: dir
            displayName: 'List project directory (debug step)'

          - script: dotnet restore ./patentdesign/patentdesign.csproj
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Restore dependencies'

          - script: dotnet publish ./patentdesign/patentdesign.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            displayName: 'Build & publish backend'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend'
              ArtifactName: 'backend'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  - stage: Deploy
    displayName: 'Deploy to Dev IIS Server'
    dependsOn: Build
    jobs:
      - job: DeployJob
        displayName: 'Deploy Application (Dev)'
        steps:
          - download: current
            artifact: backend

          - task: PowerShell@2
            displayName: 'Stop Dev App Pool, clear old files & deploy new version'
            inputs:
              targetType: 'inline'
              script: |
                Import-Module WebAdministration
                
                $appPool = "Backend"
                $source = "$(Pipeline.Workspace)\backend\*"
                $destination = "C:\Users\einaoadmin\Desktop\UpLinks\publish"
                
                Write-Host "Stopping App Pool: $appPool"
                try {
                  if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
                      Stop-WebAppPool -Name $appPool
                  } else {
                      Write-Host "App Pool '$appPool' is already stopped."
                  }
                } catch {
                  Write-Host "Warning: Could not stop App Pool. Continuing... ($($_.Exception.Message))"
                }
                
                Write-Host "Removing old files in $destination"
                Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
                
                Write-Host "Copying new build from $source to $destination"
                Copy-Item -Path $source -Destination $destination -Recurse -Force
                
                Write-Host "Starting App Pool: $appPool"
                if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                    Start-WebAppPool -Name $appPool
                } else {
                    Write-Host "App Pool '$appPool' is already running."
                }
